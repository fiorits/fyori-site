<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="Imagens/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#06040a">
    <title>Fyori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
    <style>
        @property --r { syntax: '<percentage>'; inherits: false; initial-value: 0%; }

        :root {
            --fundo: #06040a;
            --texto: #c3d1c9;
            --suave: #7d9488;
            --luz: #9bd3b8;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--fundo); }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--texto);
            font-family: 'Special Elite', 'Courier New', monospace;
            overflow: hidden;
        }

        /* Halo arroxeado central (mesma família de cor do site), névoa lenta e vinheta fixa */
        .halo {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 46%,
                rgba(70, 38, 104, 0.30) 0%,
                rgba(52, 28, 80, 0.18) 28%,
                rgba(30, 16, 48, 0.07) 48%,
                rgba(6, 4, 10, 0) 68%);
            animation: respira 14s ease-in-out infinite alternate;
        }
        @keyframes respira { from { opacity: 0.8; } to { opacity: 1; } }
        .nevoa {
            position: fixed;
            inset: -20%;
            pointer-events: none;
            background:
                radial-gradient(40% 30% at 20% 30%, rgba(98, 54, 140, 0.10), transparent 70%),
                radial-gradient(35% 28% at 80% 70%, rgba(84, 44, 122, 0.08), transparent 70%);
            animation: deriva 40s ease-in-out infinite alternate;
        }
        .vinheta {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
        }
        @keyframes deriva { from { transform: translate3d(-3%, -2%, 0); } to { transform: translate3d(3%, 2%, 0); } }

        .palco {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            transition: opacity 1.4s ease;
        }
        .conteudo { width: 100%; max-width: 580px; }

        /* Texto: o espaço de cada verso é reservado desde o início para nada se mover enquanto digita */
        .verso {
            position: relative;
            margin: 0 0 1.35rem 0;
            font-size: clamp(0.98rem, 2.6vw, 1.15rem);
            line-height: 1.75;
            letter-spacing: 0.4px;
        }
        .fantasma { opacity: 0; }
        .digitado { position: absolute; inset: 0; }
        .verso.cursor .digitado::after {
            content: "";
            display: inline-block;
            width: 0.55ch;
            height: 1em;
            margin-left: 2px;
            vertical-align: -0.12em;
            background: var(--luz);
            animation: pisca 1s steps(1) infinite;
        }
        @keyframes pisca { 50% { opacity: 0; } }

        /* Acesso */
        .acesso {
            margin-top: 2.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.6s ease;
        }
        .acesso.on { opacity: 1; pointer-events: auto; }
        .campo { display: flex; flex-direction: column; gap: 6px; }
        .campo label { font-size: 0.8rem; letter-spacing: 3px; color: var(--suave); text-transform: lowercase; }
        .campo input {
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(155, 211, 184, 0.3);
            border-radius: 0;
            color: var(--texto);
            font-family: inherit;
            font-size: 1.15rem;
            letter-spacing: 3px;
            padding: 6px 2px;
            outline: none;
            transition: border-color 0.4s ease;
        }
        .campo input:focus { border-bottom-color: var(--luz); }
        .msg { min-height: 1.3em; margin: 0; font-size: 0.9rem; color: var(--suave); letter-spacing: 1px; transition: opacity 0.6s ease; }
        .msg.some { opacity: 0; }
        .acesso.negado { animation: balanca 0.5s ease; }
        @keyframes balanca { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* Travessia: o texto some e a floresta se abre do centro, como uma pupila */
        body.atravessa .palco { opacity: 0; pointer-events: none; }
        .cena {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            background: #000;
            z-index: 5;
            --r: 0%;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 calc(var(--r) - 22%), transparent var(--r));
            mask-image: radial-gradient(ellipse at center, #000 calc(var(--r) - 22%), transparent var(--r));
            transform: scale(1.12);
            transition: --r 5s cubic-bezier(0.3, 0.1, 0.2, 1), transform 8s cubic-bezier(0.2, 0.6, 0.2, 1);
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .cena.aberta { --r: 150%; transform: scale(1); }

        @media (prefers-reduced-motion: reduce) {
            .nevoa, .halo { animation: none; }
            .cena { transition: none; }
            .acesso, .palco { transition: none; }
            .acesso.negado { animation: none; }
        }
    </style>
</head>
<body>
    <div class="halo"></div>
    <div class="nevoa"></div>
    <div class="vinheta"></div>

    <main class="palco">
        <div class="conteudo">
            <p class="verso" id="v1"><span class="fantasma">Guiado apenas pelos próprios passos, você chegou até aqui.</span><span class="digitado" aria-hidden="true"></span></p>
            <p class="verso" id="v2"><span class="fantasma">Um novo caminho se abre para quem se torna parte do Fyori.</span><span class="digitado" aria-hidden="true"></span></p>
            <p class="verso" id="v3"><span class="fantasma">Inúmeros atalhos parecem existir, mas a lamparina só acende para quem contou o que cada um carrega.</span><span class="digitado" aria-hidden="true"></span></p>
            <p class="verso" id="v4"><span class="fantasma">Agora, diga quem você é, e a floresta se lembrará.</span><span class="digitado" aria-hidden="true"></span></p>

            <form class="acesso" id="form" autocomplete="off" inert>
                <div class="campo">
                    <label for="a">login</label>
                    <input id="a" name="x1" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="campo">
                    <label for="b">senha</label>
                    <input id="b" name="x2" type="password" inputmode="numeric" autocomplete="off" required>
                </div>
                <p class="msg" id="msg" role="status" aria-live="polite"></p>
                <button type="submit" class="sr-only">Entrar</button>
            </form>
        </div>
    </main>

    <script>
    (() => {
        // Nenhum login, senha ou nome de arquivo fica legível aqui.
        // Para trocar, rode: node gerar-cofre.js <login> <senha> <arquivo> e cole as três linhas.
        const COFRE = 'TryPnmYx5Ac9swNL2jAA1n5ab67/RflN5a0ty/My1GBXJ265ocdZlefrO4NPNi6lhEdAJVyx/n+1GH7uA/Ukz+JHnR+ohg==';
        const MARCA_LOGIN = '/aZjXhwCDdWGPRte3yQ1jGs6TbJ6neTVBqjql3aVVbM6XRw1Ja4KnjPYJCk3H0P+';
        const MARCA_SENHA = 'e7FJvSj8paCaszDEi2vmO5AwT0ZqBlalRgZETdZdiGDEo0Ew59opdck90dt8Or2z';

        const form = document.getElementById('form');
        const msg = document.getElementById('msg');
        const campoLogin = document.getElementById('a');
        const campoSenha = document.getElementById('b');
        const versos = [...document.querySelectorAll('.verso')];
        const reduz = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
        const norm = (s) => s.trim().toLowerCase();
        const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

        /* ---------- som de máquina de escrever (sintetizado, sem arquivo) ---------- */
        const som = (() => {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return { tecla() {}, retorno() {}, ativo: () => false, acordar: () => Promise.resolve() };
            const ctx = new AC();
            const mestre = ctx.createGain();
            mestre.gain.value = 0.5;
            mestre.connect(ctx.destination);

            const ruido = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
            const d = ruido.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

            // Um "golpe": rajada curta de ruído filtrado com queda rápida.
            function golpe(t, freq, q, vol, dur) {
                const src = ctx.createBufferSource();
                src.buffer = ruido;
                src.playbackRate.value = 0.85 + Math.random() * 0.3;
                const f = ctx.createBiquadFilter();
                f.type = 'bandpass';
                f.frequency.value = freq;
                f.Q.value = q;
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(vol, t + 0.002);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(f).connect(g).connect(mestre);
                src.start(t, Math.random() * 0.3, dur + 0.03);
            }

            const ativo = () => ctx.state === 'running';
            return {
                ativo,
                acordar: () => ctx.resume().catch(() => {}),
                tecla(ch) {
                    if (!ativo()) return;
                    const t = ctx.currentTime + 0.005;
                    const v = 0.75 + Math.random() * 0.5;
                    if (ch === ' ') {
                        golpe(t, 700 + Math.random() * 150, 1.2, 0.18 * v, 0.05);   // barra de espaço, mais abafada
                        return;
                    }
                    golpe(t, 2400 + Math.random() * 1400, 2.8, 0.42 * v, 0.022);   // estalo do tipo
                    golpe(t + 0.006, 260 + Math.random() * 90, 4, 0.34 * v, 0.07);  // batida no rolo
                },
                retorno() {
                    if (!ativo()) return;
                    const t = ctx.currentTime + 0.01;
                    for (let i = 0; i < 9; i++) golpe(t + i * 0.028, 3200 - i * 120, 6, 0.12 * (1 - i / 12), 0.018); // catraca do carro
                    golpe(t + 0.27, 180, 3, 0.5, 0.12);                                                               // fim de curso
                }
            };
        })();

        /* ---------- texto digitado ---------- */
        // Se o navegador bloqueou o som, o primeiro toque/tecla só acorda o som; os seguintes pulam o texto.
        let pular = false, liberado = false;
        const pularAgora = () => {
            if (liberado) return;
            if (!som.ativo()) { som.acordar(); return; }
            pular = true;
        };
        document.addEventListener('keydown', pularAgora);
        document.addEventListener('pointerdown', pularAgora);

        function liberar() {
            liberado = true;
            versos.forEach((v) => v.classList.remove('cursor'));
            form.inert = false;
            form.classList.add('on');
            setTimeout(() => campoLogin.focus({ preventScroll: true }), 300);
        }

        async function digitar() {
            som.acordar(); // funciona quando o navegador permite (ex.: vindo do clique no olho)
            await esperar(reduz ? 0 : 900);
            for (const v of versos) {
                const alvo = v.querySelector('.digitado');
                const texto = v.querySelector('.fantasma').textContent;
                versos.forEach((o) => o.classList.remove('cursor'));
                v.classList.add('cursor');
                if (reduz || pular) { alvo.textContent = texto; continue; }
                for (let i = 1; i <= texto.length; i++) {
                    if (pular) { alvo.textContent = texto; break; }
                    alvo.textContent = texto.slice(0, i);
                    som.tecla(texto[i - 1]);
                    await esperar(/[,.]/.test(texto[i - 1]) ? 240 : 30 + Math.random() * 22);
                }
                if (!pular) som.retorno();
                await esperar(pular ? 0 : 520);
            }
            liberar();
        }

        /* ---------- cofre ---------- */
        // Marca = sal (16 bytes) + PBKDF2 do valor. Diz se login ou senha bateram sozinhos, sem guardá-los.
        async function confere(marca, valor) {
            const raw = bytes(marca);
            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(valor)), 'PBKDF2', false, ['deriveBits']);
            const bits = new Uint8Array(await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 200000, hash: 'SHA-256' }, base, 256
            ));
            const esperado = raw.slice(16);
            let dif = bits.length ^ esperado.length;
            for (let i = 0; i < bits.length; i++) dif |= bits[i] ^ esperado[i];
            return dif === 0;
        }

        async function destravar(login, senha) {
            const raw = bytes(COFRE);
            const salt = raw.slice(0, 16), iv = raw.slice(16, 28), dados = raw.slice(28);
            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(login) + '\u0000' + norm(senha)), 'PBKDF2', false, ['deriveKey']);
            const chave = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
            );
            // Com login/senha errados, o decrypt lança erro.
            return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, chave, dados));
        }

        function negar(texto, campo = campoSenha) {
            msg.classList.remove('some');
            msg.textContent = texto;
            form.classList.remove('negado');
            void form.offsetWidth;
            form.classList.add('negado');
            campo.value = '';
            campo.focus();
        }

        const RESPOSTAS = {
            nenhum: () => negar('a floresta não te reconhece', campoSenha),
            login: () => negar('a floresta lembra o seu nome, mas a lamparina segue apagada', campoSenha),
            senha: () => negar('a lamparina tremeluz... mas não sabe para quem', campoLogin)
        };

        function revelar(src) {
            const video = /\.(mp4|webm)$/i.test(src);
            const el = document.createElement(video ? 'video' : 'img');
            el.className = 'cena';
            el.setAttribute('aria-hidden', 'true');

            const mostrar = () => {
                document.body.appendChild(el);
                document.body.classList.add('atravessa');
                requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('aberta')));
                if (video) el.play().catch(() => { el.muted = true; el.play(); });
            };
            const falhar = () => negar('o caminho se perdeu na névoa');

            if (video) {
                el.loop = true;
                el.playsInline = true;
                el.preload = 'auto';
                el.addEventListener('loadeddata', mostrar, { once: true });
                el.addEventListener('error', falhar, { once: true });
                el.src = src;
            } else {
                el.alt = '';
                el.draggable = false;
                el.onload = mostrar;
                el.onerror = falhar;
                el.src = src;
            }
        }

        let ocupado = false;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (ocupado) return;
            if (!window.crypto || !crypto.subtle) { negar('abra pelo site (https)'); return; }
            ocupado = true;
            msg.classList.add('some');
            const login = campoLogin.value, senha = campoSenha.value;
            try {
                const [caminho, loginOk, senhaOk] = await Promise.all([
                    destravar(login, senha).catch(() => null),
                    confere(MARCA_LOGIN, login).catch(() => false),
                    confere(MARCA_SENHA, senha).catch(() => false)
                ]);
                if (caminho) { msg.textContent = ''; revelar(caminho); return; }
                RESPOSTAS[loginOk ? 'login' : senhaOk ? 'senha' : 'nenhum']();
            } finally {
                ocupado = false;
            }
        });

        digitar();
    })();
    </script>
</body>
</html>
